apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments
spec:
  replicas: 3
  selector:
    matchLabels:
      app: payments
  template:
    metadata:
      labels:
        app: payments
    spec:
      containers:
        - name: payments
          image: busybox:1.36.1
          command:
            - sh
            - -c
            - |
              mkdir -p /www
              hostname > /www/index.html
              httpd -f -p 8080 -h /www
          ports:
            - containerPort: 8080
