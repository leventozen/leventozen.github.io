<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 484" role="img" aria-label="One person, five visitor ids in two days" font-size="13" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <rect width="760" height="484" rx="12" fill="#ffffff"/>
  <text x="24" y="30" font-size="15" font-weight="600" fill="#1f2937">One person, five visitor ids in two days</text>
  <text x="24" y="60" font-size="11.5" font-weight="600" fill="#6b7280">When</text>
  <text x="120" y="60" font-size="11.5" font-weight="600" fill="#6b7280">What Tuna does</text>
  <text x="470" y="60" font-size="11.5" font-weight="600" fill="#6b7280">What the server sees</text>
  <line x1="96" y1="76" x2="96" y2="444" stroke="#e5e7eb" stroke-width="1.5"/>
  <line x1="24" y1="330" x2="736" y2="330" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="736" y="322" text-anchor="end" font-size="11.5" fill="#6b7280">00:00 UTC, new salt</text>

  <circle cx="96" cy="80" r="5" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="24" y="84" font-weight="600" fill="#1f2937">08:10</text>
  <text x="120" y="84" fill="#1f2937">Breakfast, home Wi-Fi</text>
  <text x="120" y="102" font-size="11.5" fill="#6b7280">says no to the banner</text>
  <rect x="470" y="65" width="116" height="28" rx="14" fill="#2563eb" fill-opacity="0.14" stroke="#2563eb" stroke-width="1.5"/>
  <text x="528" y="84" text-anchor="middle" font-weight="600" fill="#1f2937">Visitor A</text>
  <text x="600" y="84" font-size="11.5" fill="#6b7280">session 1</text>

  <circle cx="96" cy="148" r="5" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="24" y="152" font-weight="600" fill="#1f2937">08:20</text>
  <text x="120" y="152" fill="#1f2937">Out the door</text>
  <text x="120" y="170" font-size="11.5" fill="#6b7280">Wi-Fi to cellular, new IP</text>
  <rect x="470" y="133" width="116" height="28" rx="14" fill="#d97706" fill-opacity="0.14" stroke="#d97706" stroke-width="1.5"/>
  <text x="528" y="152" text-anchor="middle" font-weight="600" fill="#1f2937">Visitor B</text>
  <text x="600" y="152" font-size="11.5" fill="#6b7280">split: same person</text>

  <circle cx="96" cy="216" r="5" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="24" y="220" font-weight="600" fill="#1f2937">12:30</text>
  <text x="120" y="220" fill="#1f2937">Lunch, office Wi-Fi</text>
  <text x="120" y="238" font-size="11.5" fill="#6b7280">two tabs, two servers</text>
  <rect x="470" y="201" width="116" height="28" rx="14" fill="#059669" fill-opacity="0.14" stroke="#059669" stroke-width="1.5"/>
  <text x="528" y="220" text-anchor="middle" font-weight="600" fill="#1f2937">Visitor C</text>
  <text x="600" y="220" font-size="11.5" fill="#6b7280">one session, via CAS</text>

  <circle cx="96" cy="284" r="5" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="24" y="288" font-weight="600" fill="#1f2937">23:30</text>
  <text x="120" y="288" fill="#1f2937">Couch, home Wi-Fi</text>
  <text x="120" y="306" font-size="11.5" fill="#6b7280">same IP and browser as 08:10</text>
  <rect x="470" y="269" width="116" height="28" rx="14" fill="#2563eb" fill-opacity="0.14" stroke="#2563eb" stroke-width="1.5"/>
  <text x="528" y="288" text-anchor="middle" font-weight="600" fill="#1f2937">Visitor A</text>
  <text x="600" y="288" font-size="11.5" fill="#6b7280">new session, same id</text>

  <circle cx="96" cy="364" r="5" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="24" y="368" font-weight="600" fill="#1f2937">00:05</text>
  <text x="120" y="368" fill="#1f2937">Still scrolling</text>
  <text x="120" y="386" font-size="11.5" fill="#6b7280">new events get the new salt</text>
  <rect x="470" y="349" width="116" height="28" rx="14" fill="#7c3aed" fill-opacity="0.14" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="528" y="368" text-anchor="middle" font-weight="600" fill="#1f2937">Visitor D</text>
  <text x="600" y="368" font-size="11.5" fill="#6b7280">23:58 straggler: A</text>

  <circle cx="96" cy="432" r="5" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="24" y="436" font-weight="600" fill="#1f2937">Day 2</text>
  <text x="120" y="436" fill="#1f2937">Accepts the banner, logs in</text>
  <text x="120" y="454" font-size="11.5" fill="#6b7280">consent granted, identify() called</text>
  <rect x="470" y="417" width="116" height="28" rx="14" fill="#db2777" fill-opacity="0.14" stroke="#db2777" stroke-width="1.5"/>
  <text x="528" y="436" text-anchor="middle" font-weight="600" fill="#1f2937">Visitor E</text>
  <text x="600" y="436" font-size="11.5" fill="#6b7280">fresh id, no bridge</text>
  <text x="744" y="474" text-anchor="end" font-size="10.5" fill="#9ca3af" opacity="0.8">levent.dev</text>
</svg>
