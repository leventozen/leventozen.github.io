<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-label="A salt hashes one day, then it is deleted ten minutes after midnight" font-size="13" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <rect width="760" height="340" rx="12" fill="#ffffff"/>
  <text x="24" y="30" font-size="15" font-weight="600" fill="#1f2937">A salt hashes one day, then it's purged</text>
  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="160" y1="72" x2="160" y2="236"/>
    <line x1="352" y1="72" x2="352" y2="236"/>
    <line x1="544" y1="72" x2="544" y2="236"/>
    <line x1="736" y1="72" x2="736" y2="236"/>
  </g>
  <!-- Monday -->
  <text x="24" y="100" fill="#1f2937">Monday's salt</text>
  <rect x="160" y="86" width="192" height="20" rx="4" fill="#2563eb" fill-opacity="0.22" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="352" y="86" width="8" height="20" fill="#2563eb" fill-opacity="0.6"/>
  <g stroke="#dc2626" stroke-width="2"><line x1="362" y1="90" x2="374" y2="102"/><line x1="362" y1="102" x2="374" y2="90"/></g>
  <text x="384" y="100" font-size="11.5" fill="#1f2937">purged at 00:10, Monday's ids now unlinkable</text>
  <text x="356" y="78" font-size="11.5" fill="#6b7280">10-min grace</text>
  <!-- Tuesday -->
  <text x="24" y="156" fill="#1f2937">Tuesday's salt</text>
  <rect x="352" y="142" width="192" height="20" rx="4" fill="#2563eb" fill-opacity="0.22" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="544" y="142" width="8" height="20" fill="#2563eb" fill-opacity="0.6"/>
  <g stroke="#dc2626" stroke-width="2"><line x1="554" y1="146" x2="566" y2="158"/><line x1="554" y1="158" x2="566" y2="146"/></g>
  <!-- Wednesday -->
  <text x="24" y="212" fill="#1f2937">Wednesday's salt</text>
  <rect x="544" y="198" width="192" height="20" rx="4" fill="#2563eb" fill-opacity="0.22" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="736" y="198" width="8" height="20" fill="#2563eb" fill-opacity="0.6"/>
  <!-- axis -->
  <line x1="160" y1="236" x2="736" y2="236" stroke="#9ca3af" stroke-width="1.25"/>
  <text x="160" y="256" text-anchor="middle" font-size="11.5" fill="#6b7280">Mon 00:00</text>
  <text x="352" y="256" text-anchor="middle" font-size="11.5" fill="#6b7280">Tue 00:00</text>
  <text x="544" y="256" text-anchor="middle" font-size="11.5" fill="#6b7280">Wed 00:00</text>
  <text x="726" y="256" text-anchor="middle" font-size="11.5" fill="#6b7280">Thu 00:00</text>
  <!-- legend -->
  <rect x="24" y="288" width="24" height="14" rx="3" fill="#2563eb" fill-opacity="0.22" stroke="#2563eb" stroke-width="1.5"/>
  <text x="56" y="299" font-size="11.5" fill="#1f2937">hashes that day's events</text>
  <rect x="232" y="288" width="8" height="14" fill="#2563eb" fill-opacity="0.6"/>
  <text x="248" y="299" font-size="11.5" fill="#1f2937">grace for late events</text>
  <g stroke="#dc2626" stroke-width="2"><line x1="420" y1="289" x2="432" y2="301"/><line x1="420" y1="301" x2="432" y2="289"/></g>
  <text x="442" y="299" font-size="11.5" fill="#1f2937">purged, never on disk</text>
  <text x="24" y="324" font-size="11.5" fill="#6b7280">If a purge fails, an alert fires and a 48 h TTL removes the salt anyway.</text>
  <text x="744" y="328" text-anchor="end" font-size="10.5" fill="#9ca3af" opacity="0.8">levent.dev</text>
</svg>
