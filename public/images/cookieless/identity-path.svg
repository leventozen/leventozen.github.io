<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 368" role="img" aria-label="IP and User-Agent are used once, then dropped" font-size="13" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9ca3af"/>
    </marker>
  </defs>
  <rect width="760" height="368" rx="12" fill="#ffffff"/>
  <text x="24" y="32" font-size="15" font-weight="600" fill="#1f2937">IP and User-Agent are used once, then dropped</text>
  <g fill="none" stroke="#9ca3af" stroke-width="1.25">
    <path d="M176 204H210" marker-end="url(#arrow)"/>
    <path d="M364 204H398" marker-end="url(#arrow)"/>
    <path d="M552 204H586" marker-end="url(#arrow)"/>
    <path d="M288 128V174" marker-end="url(#arrow)"/>
    <path d="M288 288V234" marker-end="url(#arrow)"/>
  </g>
  <rect x="24" y="176" width="152" height="56" rx="8" fill="none" stroke="#9ca3af" stroke-width="1.25"/>
  <text x="100" y="200" text-anchor="middle" font-weight="600" fill="#1f2937">Browser</text>
  <text x="100" y="216" text-anchor="middle" font-size="11.5" fill="#6b7280">event, no identifier</text>
  <rect x="212" y="176" width="152" height="56" rx="8" fill="none" stroke="#9ca3af" stroke-width="1.25"/>
  <text x="288" y="200" text-anchor="middle" font-weight="600" fill="#1f2937">HMAC-SHA256</text>
  <text x="288" y="216" text-anchor="middle" font-size="11.5" fill="#6b7280">site + IP + UA</text>
  <rect x="400" y="176" width="152" height="56" rx="8" fill="none" stroke="#9ca3af" stroke-width="1.25"/>
  <text x="476" y="200" text-anchor="middle" font-weight="600" fill="#1f2937">Session store</text>
  <text x="476" y="216" text-anchor="middle" font-size="11.5" fill="#6b7280">30-min idle window</text>
  <rect x="588" y="176" width="152" height="56" rx="8" fill="none" stroke="#9ca3af" stroke-width="1.25"/>
  <text x="664" y="200" text-anchor="middle" font-weight="600" fill="#1f2937">Queue</text>
  <text x="664" y="216" text-anchor="middle" font-size="11.5" fill="#6b7280">ids only, no IP/UA</text>
  <rect x="196" y="72" width="184" height="56" rx="8" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"/>
  <text x="288" y="96" text-anchor="middle" font-weight="600" fill="#1f2937">Daily salt</text>
  <text x="288" y="112" text-anchor="middle" font-size="11.5" fill="#1f2937">memory only, 3 replicas</text>
  <rect x="212" y="288" width="152" height="56" rx="8" fill="none" stroke="#9ca3af" stroke-width="1.25"/>
  <text x="288" y="312" text-anchor="middle" font-weight="600" fill="#1f2937">Request headers</text>
  <text x="288" y="328" text-anchor="middle" font-size="11.5" fill="#6b7280">IP, User-Agent</text>
  <text x="298" y="156" font-size="11.5" fill="#6b7280">today's salt</text>
  <text x="380" y="320" font-size="11.5" fill="#6b7280">used once, never stored</text>
  <text x="382" y="252" text-anchor="middle" font-size="11.5" fill="#6b7280">visitor id</text>
  <text x="570" y="252" text-anchor="middle" font-size="11.5" fill="#6b7280">session id</text>
  <text x="744" y="356" text-anchor="end" font-size="10.5" fill="#9ca3af" opacity="0.8">levent.dev</text>
</svg>
